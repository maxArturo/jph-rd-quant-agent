# Promotion gate (US-007/US-010/US-031, read by ops/promotion_gate.py): a
# candidate passes when parity holds (same market/topk-n_drop/costs) AND
# candidate IR > incumbent IR × ir_margin AND candidate |MDD| <= incumbent
# |MDD| × mdd_tolerance AND candidate IC > min_ic AND candidate
# confirmation-window IR > incumbent's × confirm_ir_margin (1.0 = no margin
# on the out-of-search-sample leg). The IR/MDD legs are computed over the two
# strategies' SHARED trading days (US-031 — recorded windows legitimately
# drift as the test window rolls); fewer than min_overlap_days shared days
# fails those legs as overlap_unavailable. Window/universe drift is reported
# as verdict notes, not parity failures. allow_first: pass with no incumbent
# on record (IC still required). auto_promote: false = report-only (US-011
# kill-switch) — the GPU pipeline posts the verdict but never promotes.
promotion_gate:
  ir_margin: 1.05
  mdd_tolerance: 1.25
  min_ic: 0.0
  allow_first: false
  confirm_ir_margin: 1.0
  auto_promote: true
  min_overlap_days: 126
# Divergence tracker (US-016, read by execution/divergence.py): daily
# realized-vs-backtest drift check on the promoted strategy. Expected daily
# return = haircut × backtest mean (backtests flatter live); over the trailing
# window_days trading days z = (realized − expected) / (σ·√window_days).
# z < warn_z posts a Slack warning; z < halt_z OR drawdown since promotion
# over backtest |MDD| × mdd_tolerance writes the breaker halt file (the
# rebalancer's kill switch) and posts a rotating_light notice.
divergence:
  haircut: 0.5
  warn_z: -2.0
  halt_z: -3.0
  mdd_tolerance: 1.25
  window_days: 20
